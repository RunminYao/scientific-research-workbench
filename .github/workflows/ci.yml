name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run full tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources and templates
        run: python -m compileall -q skills shared scripts tests examples
      - name: Check representative template renders
        run: python scripts/check_templates.py
      - name: Validate plugin manifest and structure
        run: python scripts/validate_plugin.py

  tex:
    name: Ubuntu / TeX examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install minimal TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-publishers
      - name: Compile minimal example
        working-directory: examples/minimal
        run: latexmk -pdf -halt-on-error main.tex
      - name: Compute and verify pendulum example
        working-directory: examples/pendulum-workflow
        run: |
          python3 compute_period.py
          python3 verify_period.py
          latexmk -pdf -halt-on-error -cd manuscript/main.tex
      - name: Generate and compile HEP/astrophysics profile
        run: |
          profile_root="$(mktemp -d)"
          python3 skills/scaffold-manuscript-project/scripts/scaffold_project.py \
            --project-root "$profile_root" --profile hep-astrophysics --apply
          latexmk -pdf -halt-on-error -cd "$profile_root/paper/main.tex"
